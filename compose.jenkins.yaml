services:

  # Motor Docker aislado para ejecutar los pipelines de Jenkins.
  docker:
    image: docker:29.9.2-dind
    container_name: ghostops-jenkins-docker
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker
    networks:
      - jenkins-network
    command:
      - --storage-driver=overlay2
    healthcheck:
      test: ["CMD-SHELL", "docker info > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Servidor Jenkins con Docker CLI y Docker Compose instalados.
  jenkins:
    image: ghostops-jenkins:1.0.0
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    container_name: ghostops-jenkins
    restart: unless-stopped
    depends_on:
      docker:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    volumes:
      - jenkins-home:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    networks:
      - jenkins-network

networks:
  jenkins-network:
    name: ghostops-jenkins-network
    driver: bridge

volumes:
  jenkins-home:
    name: ghostops-jenkins-home
  jenkins-docker-certs:
    name: ghostops-jenkins-docker-certs
  jenkins-docker-data:
    name: ghostops-jenkins-docker-data
